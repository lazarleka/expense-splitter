spring.application.name=expense-splitter-server

# MySQL (pokrenuti: docker compose up -d iz root foldera)
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/expense_splitter
spring.datasource.username=${DB_USERNAME:splitter}

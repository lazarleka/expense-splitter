services:
  mysql:
    image: mysql:8.4
    container_name: expense-splitter-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: expense_splitter
      MYSQL_USER: splitter
      MYSQL_PASSWORD: splitter
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-usplitter", "-psplitter"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
